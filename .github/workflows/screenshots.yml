name: Native UI screenshots (Android 16 emulator)

# Renders the REAL native app on an emulator at the reference device size (1080x2340, 440 dpi, dark, 3-button nav)
# and diffs it against the reference screenshots of the original app (docs/reference/*.png).
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Free disk space for the emulator
        # The API 36 system image asks for a 7372 MB userdata partition; the runner has ~6.1 GB
        # left after the SDK/emulator install. Drop toolchains this project never uses.
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/cmake \
                      /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK (x86_64 for the CI emulator)
        run: gradle --no-daemon assembleDebug -Pabi=x86_64

      - name: Render screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          # The API 36 image defaults to a 7372 MB userdata partition, which does not fit the runner's disk.
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./tools/screenshot/run.sh

      - name: Diff against the original app's screenshots
        if: always()
        run: |
          python3 -m pip install -q pillow
          mkdir -p screenshots/crops
          : > screenshots/report.txt
          for name in expanded collapsed; do
            if [ -f "screenshots/accounts_$name.png" ]; then
              python3 tools/screenshot/diff.py "screenshots/accounts_$name.png" "docs/reference/accounts_$name.png" "screenshots/$name" | tee -a screenshots/report.txt || true
              python3 tools/screenshot/crops.py "screenshots/accounts_$name.png" "docs/reference/accounts_$name.png" screenshots/crops "$name" || true
            else
              echo "screenshots/accounts_$name.png missing" >> screenshots/report.txt
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots
          path: screenshots/
