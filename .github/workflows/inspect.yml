name: Inspect a screenshot artifact

# Downloads an existing "native-screenshots" artifact and prints exact layout landmarks
# and the best vertical alignment offset vs the reference images (no emulator needed).
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Artifact ID (from actions/runs/<id>/artifacts)
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" -o shots.zip
          unzip -o -q shots.zip -d shots
          ls -l shots
          for pair in "accounts_expanded expanded" "accounts_collapsed collapsed"; do
            set -- $pair
            if [ -f "shots/$1.png" ]; then
              python3 tools/screenshot/measure.py "shots/$1.png" "docs/reference/$1.png"
            fi
          done
          echo "---- reference landmarks ----"
          python3 tools/screenshot/measure.py docs/reference/accounts_collapsed.png
          python3 tools/screenshot/measure.py docs/reference/accounts_expanded.png
