name: Inspect a screenshot artifact

# Downloads an existing "native-screenshots" artifact and prints exact layout landmarks
# and the best vertical alignment offset vs the reference images (no emulator needed).
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Artifact ID (from actions/runs/<id>/artifacts)
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" -o shots.zip
          unzip -o -q shots.zip -d shots
          ls -l shots
          for pair in "accounts_expanded expanded" "accounts_collapsed collapsed"; do
            set -- $pair
            if [ -f "shots/$1.png" ]; then
              python3 tools/screenshot/measure.py "shots/$1.png" "docs/reference/$1.png"
            fi
          done
          echo "---- reference landmarks ----"
          python3 tools/screenshot/measure.py docs/reference/accounts_collapsed.png
          python3 tools/screenshot/measure.py docs/reference/accounts_expanded.png
          echo "---- modal landmarks ----"
          for name in account_settings bank_picker account_new accounts_light notifications; do
            [ -f "shots/$name.png" ] && python3 tools/screenshot/measure.py "shots/$name.png"
          done
          mkdir -p shots/crops
          echo "---- TwModal insets ----"
          grep -h "TwModal" shots/logcat*.txt | tail -5 || true
          echo "---- bank logos ----"
          grep -h "BankLogo" shots/logcat*.txt | tail -45 || true
          echo "---- crashes ----"
          grep -h "FATAL EXCEPTION" -A 12 shots/logcat*.txt | tail -30 || true
          if [ -f shots/account_settings.png ]; then
            python3 tools/screenshot/crops.py shots/account_settings.png shots/account_settings.png shots/crops modal
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect-crops
          path: shots/crops/
