name: tmp analyze artifact
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pillow
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" -o shots.zip
          unzip -o -q shots.zip -d shots
          mkdir -p out
          python3 - <<'PY'
          from PIL import Image, ImageChops
          W = 1080
          TOP, BOTTOM = 90, 2205

          def load(name):
              return Image.open(f"shots/{name}.png").convert("RGB"), \
                     Image.open(f"docs/reference/{name}.png").convert("RGB")

          def mask(n, r, dy, y0, y1):
              d = ImageChops.difference(n.crop((0, y0 + dy, W, y1 + dy)), r.crop((0, y0, W, y1)))
              ch = d.split()
              s = ImageChops.add(ImageChops.add(ch[0], ch[1]), ch[2])
              return s.point(lambda v: 255 if v > 60 else 0)

          def bbox(img, box, thresh=110):
              px = img.convert("L").crop(box).load()
              bw, bh = box[2] - box[0], box[3] - box[1]
              xs, ys = [], []
              for y in range(bh):
                  for x in range(bw):
                      if px[x, y] > thresh:
                          xs.append(x); ys.append(y)
              if not xs:
                  return None
              return (box[0] + min(xs), box[1] + min(ys), box[0] + max(xs) + 1, box[1] + max(ys) + 1)

          for name, bands in {
              "accounts_expanded": [(120, 320, "icons"), (300, 430, "title"), (430, 570, "buttons"), (600, 760, "grouphead")],
              "accounts_collapsed": [(120, 320, "icons"), (300, 430, "title"), (430, 570, "buttons"), (600, 760, "grouphead")],
          }.items():
              n, r = load(name)
              best = min(range(-90, 91), key=lambda dy: mask(n, r, dy, TOP, BOTTOM).histogram()[255])
              total = (BOTTOM - TOP) * W
              print(f"{name}: dy={best:+d} aligned={100*mask(n, r, best, TOP, BOTTOM).histogram()[255]/total:.2f}%")
              for y0, y1, label in bands:
                  print(f"  {label}: ref={bbox(r, (40, y0, 1040, y1))} native={bbox(n, (40, y0 + best, 1040, y1 + best))}")
              for band in range(TOP // 100, BOTTOM // 100 + 1):
                  y0, y1 = max(TOP, band * 100), min(BOTTOM, band * 100 + 100)
                  print(f"  band {band*100}: {mask(n, r, best, y0, y1).histogram()[255]}")
              for label, y0, y1 in [("header", 0, 320), ("buttons", 300, 620), ("card", 620, 1100), ("bottom", 1100, 2300)]:
                  nn = n.crop((0, y0 + best, W, min(2300, y1 + best)))
                  rr = r.crop((0, y0, W, min(2300, y1)))
                  dd = ImageChops.difference(nn, rr).point(lambda v: 255 if v > 40 else 0)
                  out = Image.new("RGB", (W, nn.height * 3))
                  out.paste(rr, (0, 0)); out.paste(nn, (0, nn.height)); out.paste(dd, (0, nn.height * 2))
                  out.save(f"out/{name}_{label}.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-analysis
          path: out/*.png
